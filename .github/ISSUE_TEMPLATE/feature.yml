name: Feature request
description: Propose a scoped recovery or safety improvement
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include real recovery data or identifying metadata.
  - type: textarea
    id: workflow
    attributes:
      label: Recovery workflow
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety implications
      description: Explain any source, destination, overwrite, privacy, or data-integrity risks.
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Proposed interface
      description: Include an example CLI or manifest shape if useful.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request contains no real disk image, recovered filename, serial number, or private log.
          required: true
