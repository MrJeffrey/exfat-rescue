name: Bug report
description: Report a reproducible problem using sanitized or synthetic data only
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload real disk images, recovered files, filenames, serial numbers, or logs. Use a synthetic reproduction and sanitize paths and output.
  - type: input
    id: version
    attributes:
      label: exfat-rescue version
      placeholder: exfat-rescue 0.2.0rc1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give exact commands and synthetic-fixture steps without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste only sanitized output.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real recovery data and identifying metadata.
          required: true
